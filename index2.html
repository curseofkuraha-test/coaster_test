<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<meta name="robots" content="noindex,nofollow,noarchive,nosnippet,noimageindex">
<title>問題2 解答入力ページ</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=Zen+Maru+Gothic:wght@500;700;900&display=swap');
:root{
  --navy:#173654;
  --navy-deep:#0f2942;
  --orange:#e97824;
  --orange-deep:#c85b12;
  --cream:#f7f1e7;
  --paper:#fffdf9;
  --text:#213142;
  --muted:#6f756f;
  --line:#e5dccf;
}
*{box-sizing:border-box}
html{scroll-behavior:smooth}
body{
  margin:0;
  min-height:100vh;
  color:var(--text);
  background:
    radial-gradient(circle at 12px 12px,rgba(23,54,84,.045) 1.5px,transparent 1.6px) 0 0/24px 24px,
    var(--cream);
  font-family:"Zen Maru Gothic","Hiragino Maru Gothic ProN","Yu Gothic",sans-serif;
}
button,input{font:inherit}
.page{
  width:100%;
  min-height:100vh;
  display:flex;
  justify-content:center;
  padding:54px 20px 72px;
}
.page-card{
  position:relative;
  isolation:isolate;
  width:min(920px,100%);
  padding:58px 58px 62px;
  border:3px solid var(--navy);
  border-radius:28px;
  background:var(--paper);
  box-shadow:0 14px 0 rgba(23,54,84,.12),0 26px 45px rgba(47,42,34,.12);
  overflow:hidden;
}
.page-card::before,
.page-card::after{
  content:"";
  position:absolute;
  z-index:0;
  border-radius:50%;
  background:var(--orange);
  opacity:.95;
}
.page-card::before{width:118px;height:118px;top:-60px;right:-42px}
.page-card::after{width:46px;height:46px;left:-19px;bottom:84px}
.page-card > *{position:relative;z-index:1;}

.section-title{
  position:relative;
  width:fit-content;
  margin:0 auto;
  padding:10px 32px 12px;
  color:#fff;
  background:var(--navy);
  border-radius:999px;
  font-size:clamp(29px,5vw,43px);
  font-weight:900;
  line-height:1.35;
  letter-spacing:.08em;
  text-align:center;
  box-shadow:0 5px 0 rgba(15,41,66,.16);
}
.section-title::before{
  content:"";
  position:absolute;
  width:12px;
  height:12px;
  top:50%;
  left:13px;
  transform:translateY(-50%);
  border-radius:50%;
  background:var(--orange);
}
.section-description{
  margin:25px auto 0;
  color:var(--muted);
  font-size:16px;
  font-weight:700;
  line-height:1.9;
  text-align:center;
}
#hint-container{width:min(750px,100%);margin:36px auto 0}
.loading-message,.error-message{margin:0;color:var(--muted);font-size:16px;line-height:1.8;text-align:center}
.accordion-item{margin-bottom:15px}
.accordion-button{
  position:relative;
  width:100%;
  padding:18px 58px 18px 23px;
  border:2px solid var(--navy);
  border-radius:15px;
  color:var(--navy);
  background:#fff;
  font-size:17px;
  font-weight:900;
  line-height:1.6;
  text-align:left;
  cursor:pointer;
  box-shadow:0 4px 0 rgba(23,54,84,.12);
  transition:transform .15s ease,background .15s ease,color .15s ease;
}
.accordion-button:hover{transform:translateY(-1px);background:#fff8f0}
.accordion-button::after{
  content:"＋";
  position:absolute;
  top:50%;
  right:18px;
  transform:translateY(-50%);
  width:30px;
  height:30px;
  display:grid;
  place-items:center;
  border-radius:50%;
  color:#fff;
  background:var(--orange);
  font-size:20px;
  line-height:1;
}
.accordion-button.is-open{color:#fff;background:var(--navy)}
.accordion-button.is-open::after{content:"−";background:#fff;color:var(--navy)}
.accordion-content{
  display:none;
  margin:10px 8px 0;
  padding:20px 22px;
  border:2px solid #f0c6a4;
  border-radius:14px;
  color:var(--text);
  background:#fff4e9;
  font-size:16px;
  font-weight:700;
  line-height:2;
  white-space:pre-wrap;
}
.accordion-content.is-open{display:block}

.hint-image{
  display:block;
  width:auto;
  max-width:100%;
  max-height:520px;
  height:auto;
  margin:20px auto;
  object-fit:contain;
}

.section-divider{
  width:min(720px,92%);
  margin:58px auto 50px;
  border:0;
  border-top:3px dashed #d9c9b5;
}
.answer-form{width:min(790px,100%);margin:40px auto 0}
.answer-row{display:flex;align-items:center;justify-content:center;gap:12px}
.answer-label{flex-shrink:0;color:var(--navy);font-size:15px;font-weight:900;line-height:1.7}
.answer-input{
  flex:1;
  min-width:180px;
  height:58px;
  padding:0 18px;
  border:2px solid var(--navy);
  border-radius:13px;
  outline:none;
  color:var(--text);
  background:#fff;
  font-size:17px;
  box-shadow:inset 0 2px 0 rgba(23,54,84,.06);
}
.answer-input:focus{border-color:var(--orange);box-shadow:0 0 0 4px rgba(233,120,36,.18)}
.submit-button{
  flex-shrink:0;
  min-width:110px;
  height:58px;
  padding:0 22px;
  border:0;
  border-radius:13px;
  color:#fff;
  background:var(--orange);
  font-size:17px;
  font-weight:900;
  cursor:pointer;
  box-shadow:0 5px 0 var(--orange-deep);
  transition:transform .12s ease,box-shadow .12s ease;
}
.submit-button:hover{filter:brightness(.98)}
.submit-button:active{transform:translateY(4px);box-shadow:0 1px 0 var(--orange-deep)}
.answer-message{min-height:40px;margin-top:22px;font-size:22px;font-weight:900;line-height:1.7;text-align:center}
.answer-message.correct{color:var(--orange-deep)}
.answer-message.incorrect{color:var(--navy)}
.correct-modal{
  position:fixed;
  inset:0;
  z-index:1000;
  display:none;
  align-items:center;
  justify-content:center;
  padding:20px;
  background:rgba(15,41,66,.72);
}
.correct-modal.is-open{display:flex}
.correct-modal-box{
  width:min(500px,100%);
  padding:42px 28px 35px;
  border:4px solid var(--navy);
  border-radius:24px;
  background:var(--paper);
  box-shadow:0 12px 0 rgba(15,41,66,.22);
  text-align:center;
}
.correct-modal-title{margin:0;color:var(--orange-deep);font-size:30px;font-weight:900;line-height:1.6}
.correct-modal-button{
  min-width:160px;
  height:52px;
  margin-top:28px;
  padding:0 22px;
  border:0;
  border-radius:999px;
  color:#fff;
  background:var(--navy);
  font-size:16px;
  font-weight:900;
  cursor:pointer;
}

.page{
  flex-direction:column;
  align-items:center;
}
.page-logo{
  width:min(520px,92vw);
  margin:8px auto 30px;
  text-align:center;
}
.page-logo img{
  display:block;
  width:100%;
  max-height:220px;
  height:auto;
  margin:0 auto;
  object-fit:contain;
}

@media(max-width:760px){

  .page-logo{
    width:min(360px,88vw);
    margin:2px auto 22px;
  }
  .page-logo img{
    max-height:150px;
  }

  .page{padding:24px 12px 44px}
  .page-card{padding:44px 18px 40px;border-width:2px;border-radius:22px}
  .page-card::before{width:86px;height:86px;top:-44px;right:-34px}
  .page-card > *{position:relative;z-index:1;}

.section-title{padding:9px 27px 10px;font-size:28px}
  .section-title::before{width:10px;height:10px;left:11px}
  .section-description{font-size:14px;text-align:center}
  #hint-container{margin-top:30px}
  .accordion-button{padding:16px 52px 16px 17px;border-radius:13px;font-size:15px}
  .accordion-button::after{right:14px;width:28px;height:28px;font-size:18px}
  .accordion-content{margin:9px 3px 0;padding:17px 16px;font-size:15px}
  .section-divider{margin:43px auto 39px}
  .answer-form{margin-top:32px}
  .answer-row{display:grid;grid-template-columns:minmax(0,1fr) 88px;gap:10px}
  .answer-label{grid-column:1/-1;font-size:14px;text-align:left}
  .answer-input{width:100%;min-width:0;height:54px;font-size:16px}
  .submit-button{min-width:0;height:54px;padding:0 10px;font-size:15px}
  .answer-message{min-height:34px;font-size:18px}
  .correct-modal-title{font-size:25px}
}
</style>
</head>
<body>
<main class="page">

  <div class="page-logo">
    <img src="./image/title2.png" alt="タイトルロゴ">
  </div>

  <div class="page-card">
    <section>
      <h1 class="section-title">ヒント</h1>
      <p class="section-description">必要なところまで、少しずつヒントを開いてください。</p>
      <div id="hint-container"><p class="loading-message">ヒントを読み込んでいます……</p></div>
    </section>

    <hr class="section-divider">

    <section>
      <h2 class="section-title">答えを入力</h2>
      <p class="section-description">導いた答えを入力して、送信してください。</p>
      <div class="answer-form">
        <div class="answer-row">
          <label class="answer-label" for="answer-input">答えはこちらに入力してください。</label>
          <input id="answer-input" class="answer-input" type="text" inputmode="text" autocomplete="off" placeholder="答えを入力">
          <button id="submit-button" class="submit-button" type="button">送信</button>
        </div>
        <div id="answer-message" class="answer-message" aria-live="polite"></div>
      </div>
    </section>
  </div>
</main>

<div id="correct-modal" class="correct-modal" role="dialog" aria-modal="true" aria-labelledby="correct-modal-title">
  <div class="correct-modal-box">
    <p id="correct-modal-title" class="correct-modal-title">正解です！<br>おめでとうございます！</p>
    <button id="correct-modal-button" class="correct-modal-button" type="button">閉じる</button>
  </div>
</div>

<script>
"use strict";
const answerInput=document.getElementById("answer-input");
const answerMessage=document.getElementById("answer-message");
const submitButton=document.getElementById("submit-button");
const hintContainer=document.getElementById("hint-container");
const correctModal=document.getElementById("correct-modal");
const correctModalButton=document.getElementById("correct-modal-button");

function normalizeAnswer(value){
  return String(value)
    .normalize("NFKC")
    .toLowerCase()
    .replace(/[\s　]+/g,"");
}

function checkAnswer(){
  const answer=normalizeAnswer(answerInput.value);
  const correctAnswers=["こーひー","コーヒー","coffee","珈琲"].map(normalizeAnswer);
  answerMessage.classList.remove("correct","incorrect");

  if(!answer){
    answerMessage.textContent="答えを入力してください。";
    answerMessage.classList.add("incorrect");
    return;
  }

  if(correctAnswers.includes(answer)){
    answerMessage.textContent="正解です！おめでとうございます！";
    answerMessage.classList.add("correct");
    correctModal.classList.add("is-open");
    correctModalButton.focus();
    return;
  }

  answerMessage.textContent="答えが違うようです。もう一度考えてみましょう。";
  answerMessage.classList.add("incorrect");
}

function closeCorrectModal(){
  correctModal.classList.remove("is-open");
  answerInput.focus();
}

function parseCsv(text){
  const rows=[];
  let row=[],field="",inQuotes=false;

  for(let i=0;i<text.length;i++){
    const char=text[i],next=text[i+1];

    if(char==='"'){
      if(inQuotes&&next==='"'){field+='"';i++}
      else inQuotes=!inQuotes;
      continue;
    }

    if(char===","&&!inQuotes){
      row.push(field);
      field="";
      continue;
    }

    if((char==="\n"||char==="\r")&&!inQuotes){
      if(char==="\r"&&next==="\n")i++;
      row.push(field);
      if(row.some(value=>String(value).trim()!==""))rows.push(row);
      row=[];
      field="";
      continue;
    }

    field+=char;
  }

  row.push(field);
  if(row.some(value=>String(value).trim()!==""))rows.push(row);
  return rows;
}

async function loadHints(){
  try{
    const response=await fetch("./hints2.csv",{cache:"no-store"});
    if(!response.ok)throw new Error("CSVの読み込みに失敗しました。");

    let text=await response.text();
    if(text.charCodeAt(0)===0xFEFF)text=text.slice(1);

    buildHints(parseCsv(text));
  }catch(error){
    console.error(error);
    hintContainer.innerHTML='<p class="error-message">ヒントを読み込めませんでした。</p>';
  }
}


function renderHintContent(element,content){
  const source=String(content)
    .replace(/^[\s,，]+/,"")
    .replace(/<br\s*\/?\s*>/gi,"<br>");

  const tokenPattern=/<br>|<img\s+[^>]*src\s*=\s*["']([^"']+)["'][^>]*>/gi;
  let lastIndex=0;
  let match;

  element.textContent="";

  while((match=tokenPattern.exec(source))!==null){
    const before=source.slice(lastIndex,match.index);

    if(before){
      element.appendChild(document.createTextNode(before));
    }

    if(match[0].toLowerCase()==="<br>"){
      element.appendChild(document.createElement("br"));
    }else{
      const src=match[1].trim();

      if(/^\.\/image\/[A-Za-z0-9_.\-\/]+$/.test(src)){
        const image=document.createElement("img");
        image.src=src;
        image.alt="ヒント画像";
        image.className="hint-image";
        element.appendChild(image);
      }
    }

    lastIndex=tokenPattern.lastIndex;
  }

  const after=source.slice(lastIndex);

  if(after){
    element.appendChild(document.createTextNode(after));
  }
}

function buildHints(rows){
  hintContainer.innerHTML="";

  if(!rows.length){
    hintContainer.innerHTML='<p class="error-message">ヒントは登録されていません。</p>';
    return;
  }

  if(String(rows[0][0]||"").trim()==="タイトル"&&String(rows[0][1]||"").trim()==="内容"){
    rows=rows.slice(1);
  }

  rows.forEach((row,index)=>{
    const title=String(row[0]||"").trim();
    const content=row.slice(1).join(",").trim().replace(/^[\s,，]+/,"");
    if(!title&&!content)return;

    const item=document.createElement("div");
    const button=document.createElement("button");
    const contentBox=document.createElement("div");

    item.className="accordion-item";
    button.type="button";
    button.className="accordion-button";
    button.textContent=title||`ヒント${index+1}`;
    button.setAttribute("aria-expanded","false");
    contentBox.className="accordion-content";
    renderHintContent(contentBox,content);

    button.addEventListener("click",()=>{
      const isOpen=button.classList.contains("is-open");
      button.classList.toggle("is-open",!isOpen);
      contentBox.classList.toggle("is-open",!isOpen);
      button.setAttribute("aria-expanded",String(!isOpen));
    });

    item.append(button,contentBox);
    hintContainer.appendChild(item);
  });

  if(!hintContainer.children.length){
    hintContainer.innerHTML='<p class="error-message">ヒントは登録されていません。</p>';
  }
}

submitButton.addEventListener("click",checkAnswer);
answerInput.addEventListener("keydown",event=>{
  if(event.key==="Enter")checkAnswer();
});
correctModalButton.addEventListener("click",closeCorrectModal);
correctModal.addEventListener("click",event=>{
  if(event.target===correctModal)closeCorrectModal();
});
document.addEventListener("keydown",event=>{
  if(event.key==="Escape"&&correctModal.classList.contains("is-open")){
    closeCorrectModal();
  }
});

loadHints();
</script>
</body>
</html>
